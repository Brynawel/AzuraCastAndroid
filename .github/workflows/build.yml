name: Build app with Skip button
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the skip feature
        run: |
          if [ ! -f skip-song-changed-files.zip ]; then
            echo "Upload skip-song-changed-files.zip to your repo first"
            exit 1
          fi
          unzip -o skip-song-changed-files.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: azuracast-app-with-skip
          path: app/build/outputs/apk/debug/*.apk
